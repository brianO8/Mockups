:root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#142542;background:#f4f6fa;color-scheme:light;--line:#dce4ee;--muted:#52647d;--blue:#1457a6;--orange:#a04312}
*{box-sizing:border-box}body{margin:0}button{font:inherit}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #2c7acf;outline-offset:3px}
.top{background:#fff;border-bottom:1px solid var(--line)}.top-inner{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:15px clamp(18px,4vw,48px);gap:12px}.brand{display:block;width:118px;height:auto}.company{font-size:.88rem;color:var(--muted)}
main{max-width:1280px;margin:auto;padding:38px clamp(18px,4vw,48px) 45px}.head,.section-head{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
h1,h2,p{margin:0}h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.045em;line-height:1.05}.period{color:var(--muted);margin-top:10px}.period strong{color:#233a5c}
.switcher{display:flex;flex-wrap:wrap;gap:3px;background:#e9eff6;border:1px solid var(--line);border-radius:11px;padding:4px}.switcher button{background:transparent;color:#42536d;border:1px solid transparent;padding:8px 12px;border-radius:7px;cursor:pointer;font-size:.88rem;font-weight:600}.switcher button:hover{background:#f4f7fb}.switcher button[aria-pressed=true]{background:#fff;border-color:#d4dfed;color:#104c94;box-shadow:0 1px 2px #16264313}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.metric,.report{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 5px #14254206}.metric{padding:17px 20px}.metric dt{color:var(--muted);font-size:.89rem;font-weight:600}.metric dd{margin:5px 0 0;font-size:1.95rem;font-weight:730;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.section-head{padding:19px 20px 16px}h2{font-size:1.18rem;letter-spacing:-.02em}.scale{font-size:.84rem;color:var(--muted);margin-top:4px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.81rem;color:var(--muted)}.better{color:var(--blue)}.worse{color:var(--orange)}
.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px;text-align:left;font-size:.9rem;font-variant-numeric:tabular-nums}thead{background:#f0f4f9;color:#344b6b}th,td{padding:13px 12px;border-top:1px solid var(--line);white-space:nowrap}th:first-child{padding-left:20px}.group-head{width:24%}.group{font-weight:650}.group small{display:block;font-size:.76rem;font-weight:500;color:var(--muted);margin-top:3px}.level-1 .group{padding-left:33px}.level-2 .group{padding-left:46px}.total{background:#edf5ff}.total .score{font-weight:750}.score{display:inline-block;min-width:2.15rem;font-weight:630}.delta{font-size:.79rem;font-weight:650}.muted,.hidden-cell{color:var(--muted)}.hidden-cell{background:#f8fafc}.note{border-top:1px solid var(--line);padding:13px 20px;color:var(--muted);font-size:.84rem;line-height:1.5}.sample{margin-top:14px;color:var(--muted);font-size:.8rem}
@media(max-width:620px){main{padding-top:26px}.metrics{gap:7px}.metric{padding:10px}.metric dt{font-size:.77rem}.metric dd{font-size:1.54rem}.section-head{gap:12px}.switcher button{padding:8px}.note{padding:12px}}
</style>

    <div><h1>Employee Pulse</h1><p class="period" id="period" aria-live="polite"></p></div>
    <div class="switcher" id="switcher" role="group" aria-label="Reporting period"></div>
  </div>
  <dl class="metrics" aria-label="Participation">
    <div class="metric"><dt>Prompts answered</dt><dd id="prompts"></dd></div>
    <div class="metric"><dt>Employees who responded</dt><dd id="employees"></dd></div>
    <div class="metric"><dt>Total responses</dt><dd id="responses"></dd></div>
  </dl>
  <section class="report" aria-labelledby="report-title">
    <div class="section-head">
      <div><h2 id="report-title">Theme scores by group</h2><p class="scale">Scores out of 5 · Change from the prior period</p></div>
      <div class="legend"><span><b class="better">●</b> Better</span><span><b class="worse">●</b> Worse</span><span>– No meaningful change</span></div>
    </div>
    <div class="table-scroll" tabindex="0" role="region" aria-label="Group scores table">
      <table aria-labelledby="report-title"><thead><tr><th class="group-head" scope="col">Group</th><th scope="col">Responses</th><th scope="col">Management</th><th scope="col">Workload</th><th scope="col">Burnout</th><th scope="col">Pay fairness</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
    <p class="note" id="privacy"></p>
  </section>
  <!-- <p class="sample">Sample data · Last completed reporting periods</p> -->
</main>
<script>
const higherBetter = [true, true, false, true];
const groups = [
  {name:'Company (214)', lvl:0, bold:true, v:[4.1,3.4,2.6,3.2], d:[0.0,-0.3,-0.2,0.2]},
  {name:'Division A (62)', lvl:0, v:[4.3,3.6,2.4,3.3], d:[0.3,-0.1,-0.3,0.0]},
  {name:'Division B (41)', lvl:0, v:[3.8,3.0,3.1,3.1], d:[-0.3,-0.4,0.4,0.0]},
  {name:'Dept 4 (28)', lvl:1, v:[3.9,2.9,3.3,3.0], d:[0.1,-0.4,0.5,-0.1]},
  {name:'Dept 9 (8)', lvl:1, v:[4.0,3.5,2.7,3.4], d:[0.1,-0.1,0.0,0.1]},
  {name:'Position 3103 (23)', lvl:2, v:[4.2,3.1,2.8,3.6], d:[0.0,-0.2,-0.1,0.4]},
  {name:'Position 2101 (18)', lvl:2, v:[3.8,3.3,3.0,3.1], d:[-0.1,0.0,0.1,-0.1]}
];
const P = {
  Weekly: {label:'Week of Nov 9-15', vs:'Nov 2-8', t:['70%','82%','760'],
    note:'Weekly is limited to company and divisions. Smaller groups are hidden because one week is too easy to trace to individuals.',
    n:[760,220,145,'Not shown in the weekly view','Not shown in the weekly view','Not shown in the weekly view','Not shown in the weekly view']},
  Monthly: {label:'October 2026', vs:'September 2026', t:['71%','96%','3,200'],
    note:'Department scores and changes appear only when at least 8 employees respond. Dept 9 is below that minimum this month.',
    n:[3200,930,610,420,'Hidden · Below the 8-respondent minimum',345,270]},
  Quarterly: {label:'Q3 2026 (Jul-Sep)', vs:'Q2 2026', t:['72%','98%','9,600'],
    note:'Dept 9 meets the 8-respondent minimum for the quarter.',
    n:[9600,2800,1850,1260,340,1040,810]},
  Annual: {label:'2025', vs:'2024', t:['72%','99%','38,000'],
    note:'Groups need at least 8 respondents before scores and changes can appear.',
    n:[38000,11200,7400,5000,1360,4100,3200]}
};
const periodButtons = document.getElementById('switcher');
const metrics = ['prompts', 'employees', 'responses'];
const formatCount = new Intl.NumberFormat('en-US');

function scoreCell(score, change, index, count) {
  const meaningful = Math.abs(change) >= 3 / Math.sqrt(count / 4);
  if (!meaningful) {
    return `<td><span class="score">${score.toFixed(1)}</span><span class="delta muted" title="No meaningful change">–</span></td>`;
  }
  const better = (change > 0) === higherBetter[index];
  const direction = change > 0 ? '▲' : '▼';
  const outcome = better ? 'Better' : 'Worse';
  return `<td><span class="score">${score.toFixed(1)}</span><span class="delta ${outcome.toLowerCase()}" title="${outcome}">${direction} ${Math.abs(change).toFixed(1)}</span></td>`;
}

function render(periodName) {
  const period = P[periodName];
  document.getElementById('period').innerHTML = `<strong>${period.label}</strong> · Compared with ${period.vs}`;
  metrics.forEach((id, index) => {
    document.getElementById(id).textContent = period.t[index];
  });
  document.getElementById('privacy').textContent = period.note;
  document.getElementById('rows').innerHTML = groups.map((group, index) => {
    const count = period.n[index];
    const [, name, headcount] = group.name.match(/^(.*) \((\d+)\)$/);
    const details = typeof count === 'number'
      ? `<td>${formatCount.format(count)}</td>` + group.v.map((score, theme) => scoreCell(score, group.d[theme], theme, count)).join('')
      : `<td class="hidden-cell" colspan="5">${count}</td>`;
    return `<tr class="level-${group.lvl} ${group.bold ? 'total' : ''}"><th scope="row" class="group">${name}<small>${headcount} employees</small></th>${details}</tr>`;
  }).join('');
  for (const button of periodButtons.children) {
    button.setAttribute('aria-pressed', String(button.textContent === periodName));
  }
}

for (const periodName of Object.keys(P)) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = periodName;
  button.addEventListener('click', () => render(periodName));
  periodButtons.append(button);
}
render('Monthly');
</script>
</body>
</html>
